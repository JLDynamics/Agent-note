[project]
name = "agent-note"
version = "0.1.0"
description = "A skill-first, append-only local note system with a JSON CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["notes", "knowledge-management", "embeddings", "local-first", "agent-skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastembed>=0.6",
]

[project.optional-dependencies]
remote = [
    "mcp==2.0.0",
    "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
agent-note = "agent_note.cli:main"
agent-note-mcp = "agent_note.remote_server:main"

[project.urls]
Homepage = "https://github.com/JLDynamics/Agent-note"
Repository = "https://github.com/JLDynamics/Agent-note"
Issues = "https://github.com/JLDynamics/Agent-note/issues"

[dependency-groups]
dev = [
    "mcp==2.0.0",
    "pyjwt[crypto]>=2.10,<3",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_note"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real-model tests (downloads ~90 MB); run with -m slow"]
addopts = "-m 'not slow'"
